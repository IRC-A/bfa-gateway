services:
  bfa-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bfa-gateway
    image: sandrog77/bfa-gateway:latest
    ports:
      - "8000:8000"
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BFA_USE_MOCK_EMBEDDINGS=true
      - BFA_USE_OPENAI_EMBEDDINGS=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - hos_network
      - irca

networks:
  hos_network:
    name: hos_network
    external: true
  irca:
    external: true
