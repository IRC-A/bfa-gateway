services:
  bfa-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bfa-gateway
    image: sandrog77/bfa-gateway:latest
    ports:
      - "8000:8000"
    environment:
      - BFA_USE_MOCK_EMBEDDINGS=true
      - BFA_USE_OPENAI_EMBEDDINGS=false
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - irca

  bfa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bfa-frontend
    image: sandrog77/bfa-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_GATEWAY_URL=http://localhost:8000
    depends_on:
      - bfa-gateway
    networks:
      - irca

networks:
  irca:
    name: irca
    driver: bridge
    attachable: true
