[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfa-gateway"
version = "0.3.0"
description = "Backend for Agents (BFA) Gateway Server with FAISS semantic routing & PASETO token minter."
readme = "README.md"
authors = [
    { name = "Sandro Garcia" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
    "a2a-sdk",
    "numpy",
    "faiss-cpu",
    "pydantic",
    "pyyaml",
    "mangum",
    "openai",
    "pyjwt",
    "cryptography"
]
requires-python = ">=3.10"

[project.optional-dependencies]
local = [
    "sentence-transformers"
]

[project.scripts]
bfa-gateway = "bfa_gateway.app:main"
irc-a-gateway = "bfa_gateway.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bfa_gateway*"]

[tool.pytest.ini_options]
pythonpath = ["."]
anyio_backend = "asyncio"

