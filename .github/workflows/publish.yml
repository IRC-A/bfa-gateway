name: Publish Docker Image and GitHub Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auto-bump version (Push/PR)
        if: github.event_name != 'release'
        run: |
          BASE_VERSION=$(grep -E '^version = ' pyproject.toml | awk -F '"' '{print $2}')
          NEW_VERSION="${BASE_VERSION}.dev${{ github.run_number }}"
          sed -i "s/version = \"$BASE_VERSION\"/version = \"$NEW_VERSION\"/" pyproject.toml
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Set Version for Release
        if: github.event_name == 'release'
        run: |
          BASE_VERSION=$(grep -E '^version = ' pyproject.toml | awk -F '"' '{print $2}')
          echo "NEW_VERSION=$BASE_VERSION" >> $GITHUB_ENV
          echo "VERSION=$BASE_VERSION" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Optional if secrets provided)
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Image Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            sandrog77/bfa-gateway
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ env.VERSION }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          name: "Release v${{ env.NEW_VERSION }}"
          prerelease: ${{ github.event_name == 'pull_request' }}
          generate_release_notes: true
